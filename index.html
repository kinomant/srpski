<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Српски">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c111b" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%231d43c9'/><text x='50%25' y='64%25' font-family='Arial Black,Arial' font-size='104' font-weight='900' fill='%23ffffff' text-anchor='middle'>Ћ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<title>Српски тренажёр</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div id="home"></div>

  <div id="lesson" hidden>
    <header class="lesson-top">
      <button class="icon-btn" id="back" aria-label="К урокам">
        <svg width="10" height="16" viewBox="0 0 10 16"><path d="M8 2 2 8l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="lt-title" id="lt-title"></div>
      <div class="lt-actions">
        <button class="theme-toggle-btn" type="button" aria-label="Сменить тему"></button>
        <button class="pill-btn" id="rule-btn">Правило</button>
      </div>
    </header>
    <nav class="sections" id="sections"></nav>
    <div class="track" id="track"></div>
    <div id="sticky-video-box" hidden></div>
    <main class="card" id="exercise"></main>
    <div class="lesson-foot"><button class="link-btn" id="reset">Сбросить раздел</button></div>
    <div class="actionbar"><div class="actionbar-inner" id="actionbar-inner"></div></div>
  </div>
</div>

<div class="sheet" id="rule-sheet" hidden>
  <div class="sheet-bg" id="rule-bg"></div>
  <div class="sheet-panel" role="dialog" aria-label="Правило">
    <div class="sheet-grip"></div>
    <div class="sheet-head"><b>Правило</b><button class="tool" id="rule-close">Закрыть</button></div>
    <div class="rule" id="rule-body" lang="ru"></div>
  </div>
</div>

<script src="lessons.js"></script>
<script src="listen.js"></script>
<script src="quizzes.js"></script>
<script src="vocab-db.js"></script>
<script src="reads.js"></script> 
<script src="app.js"></script>
</body>
</html>
